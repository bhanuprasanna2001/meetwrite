name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          python-version: "3.13"
          working-directory: api
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting and lint
        run: |
          uv run --no-sync ruff format --check src tests migrations scripts
          uv run --no-sync ruff check src tests migrations scripts

      - name: Check types
        run: uv run --no-sync mypy src

      - name: Run tests
        run: uv run --no-sync pytest -q

      - name: Verify fresh migration parity
        run: |
          migration_dir="$(mktemp -d)"
          export MEETWRITE_DATABASE_URL="sqlite:///$migration_dir/meetwrite.db"
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
