name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: Build and publish the macOS app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          python-version: "3.13"
          working-directory: api
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      # webrtc-audio-processing compiles its bundled C++ library with meson.
      - name: Install system dependencies
        run: brew install meson ninja

      # Builds the PyInstaller sidecar, then the signed-ready Tauri DMG.
      # To sign + notarize, add repo secrets APPLE_SIGNING_IDENTITY, APPLE_ID,
      # APPLE_PASSWORD, and APPLE_TEAM_ID - the Makefile forwards them to Tauri.
      - name: Build the app
        run: make app

      # Copies the DMG to a fixed asset name (meetwrite-macos.dmg) and creates
      # a release; the landing page already links to that stable URL.
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release
