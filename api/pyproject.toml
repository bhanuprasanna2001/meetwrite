[project]
name = "meetwrite"
version = "0.1.0"
description = "Minimalist, local-first meeting notes for Mac. Record, write, ask."
readme = "README.md"
authors = [
    { name = "Bhanu Prasanna", email = "bhanu.prasanna2001@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "keyring>=25.7.0",
    "openai>=3.2.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
    "websockets>=17.0.1",
]

[project.scripts]
meetwrite = "meetwrite.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
